# Render Blueprint: the Rails API and the React frontend on Render's free tier, with
# the database on Supabase (free, 500 MB). See docs/deploy-render.md.
services:
  - type: web
    name: nepse-journal-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # Puma straight on Render's PORT (the image's default goes through Thruster on 80).
    dockerCommand: ./bin/rails server
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # Pasted in the dashboard, never committed.
      - key: DATABASE_URL # Supabase "Session pooler" connection string
        sync: false
      - key: RAILS_MASTER_KEY # contents of config/master.key (Telegram bot token etc.)
        sync: false
      # Generated by Render, seen by nobody.
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Must match the URLs Render gives the two services (Settings > URL).
      - key: FRONTEND_ORIGINS
        value: https://nepse-journal.onrender.com
      - key: API_HOSTS
        value: nepse-journal-api.onrender.com
      # Jobs as threads in the web process: 512 MB holds one Ruby process, not four.
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
      - key: SOLID_QUEUE_MODE
        value: async
      - key: RAILS_MAX_THREADS
        value: "3"
      # jemalloc: hand freed memory back to the system soon after the nightly jobs.
      - key: MALLOC_CONF
        value: dirty_decay_ms:1000,muzzy_decay_ms:0,narenas:2,background_thread:true
      # Keep the database under 500 MB (Maintenance::DataRetention, nightly).
      - key: RETAIN_FLOW_SESSIONS
        value: "30"
      - key: RETAIN_SNAPSHOT_SESSIONS
        value: "130"
      - key: RETAIN_INTRADAY_DAYS
        value: "25"

  - type: web
    name: nepse-journal
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nepse-journal-api.onrender.com/api/v1
