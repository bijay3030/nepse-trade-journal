default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# With one database (DATABASE_URL) the cache store is in memory and Solid Cache
# isn't used, so it needs no database of its own.
production:
<% unless ENV["DATABASE_URL"].present? %>
  database: cache
<% end %>
  <<: *default
