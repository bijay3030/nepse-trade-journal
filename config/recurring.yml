# Solid Queue recurring tasks. They run when a Solid Queue worker is running
# (bin/dev starts one inside Puma, or run bin/jobs separately).
shared: &shared
  # Refresh the market table every 5 minutes. The job skips itself outside
  # NEPSE trading hours (Mon-Fri, 11:00-15:15 Nepal time; see Nepse::MarketHours).
  market_price_sync:
    class: SyncMarketPricesJob
    queue: default
    schedule: every 5 minutes

  # End-of-day closing prices: 4:00 PM Nepal time (10:15 UTC), Mon-Fri.
  daily_nepse_price_fetch:
    class: SyncMarketPricesJob
    args: [ true ]
    queue: default
    schedule: "15 10 * * 1-5 UTC"

production:
  <<: *shared

development:
  <<: *shared
