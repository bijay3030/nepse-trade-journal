# Solid Queue recurring tasks. They run when a Solid Queue worker is running
# (bin/dev starts one inside Puma, or run bin/jobs separately).
shared: &shared
  # Refresh the market table every 5 minutes. The job skips itself outside
  # NEPSE trading hours (Mon-Fri, 11:00-15:15 Nepal time; see Nepse::MarketHours).
  market_price_sync:
    class: SyncMarketPricesJob
    queue: default
    schedule: every 5 minutes

  # End-of-day closing prices: 4:00 PM Nepal time (10:15 UTC), Mon-Fri.
  daily_nepse_price_fetch:
    class: SyncMarketPricesJob
    args: [ true ]
    queue: default
    schedule: "15 10 * * 1-5 UTC"

  # Securities list, dividends and index history: 4:30 PM Nepal time, Mon-Fri.
  reference_data_daily:
    class: SyncReferenceDataJob
    args: [ "daily" ]
    queue: default
    schedule: "45 10 * * 1-5 UTC"

  # Links and unlinks Telegram chats from the bot's "/start <code>" and "/stop"
  # messages. Does nothing without TELEGRAM_BOT_TOKEN.
  telegram_poll:
    class: TelegramPollJob
    queue: default
    schedule: every minute

  # Trend template, relative strength, zones and buy readiness: 4:45 PM Nepal time, Mon-Fri,
  # after the closing prices and reference data.
  setup_snapshots:
    class: BuildSetupSnapshotsJob
    queue: default
    schedule: "0 11 * * 1-5 UTC"

  # Fundamentals: Saturday 9:45 AM Nepal time (takes about an hour).
  reference_data_weekly:
    class: SyncReferenceDataJob
    args: [ "weekly" ]
    queue: default
    schedule: "0 4 * * 6 UTC"

production:
  <<: *shared

development:
  <<: *shared
