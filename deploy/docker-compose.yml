# Production on one server: Rails API (with Solid Queue running the jobs inside
# Puma), PostgreSQL, and Caddy for HTTPS. Settings come from deploy/.env, which
# is created on the server and never committed (see .env.example).
name: nepse-journal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nepse_trade_journal
      POSTGRES_PASSWORD: ${NEPSE_TRADE_JOURNAL_DATABASE_PASSWORD:?set it in deploy/.env}
      POSTGRES_DB: nepse_trade_journal_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nepse_trade_journal -d nepse_trade_journal_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nepse-journal-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      DB_HOST: db
      DB_USER: nepse_trade_journal
      SOLID_QUEUE_IN_PUMA: "true"
      RAILS_LOG_TO_STDOUT: "true"
      TZ: Asia/Kathmandu
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
